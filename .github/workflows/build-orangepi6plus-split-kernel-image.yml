# edit by codex
name: Build Orange Pi 6 Plus Split Kernel and Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub Release tag. Use "auto" to generate one.
        required: false
        default: auto
      kernel_runner_system:
        description: x86 runner for kernel and Cix driver build
        required: true
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-latest
      image_runner_system:
        description: ARM64 runner for rootfs and image build
        required: true
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
      add_kernel_android_support:
        description: Add Kernel Android support
        required: false
        type: boolean
        default: true
      add_kernel_usb_device_support:
        description: Add Kernel USB device support
        required: false
        type: boolean
        default: false
      appgroup_3dsupport:
        description: Include 3D support packages
        required: false
        type: boolean
        default: true
      appgroup_browsers:
        description: Include browser packages
        required: false
        type: boolean
        default: true
      appgroup_chat:
        description: Include chat packages
        required: false
        type: boolean
        default: false
      appgroup_desktop_tools:
        description: Include desktop tools packages
        required: false
        type: boolean
        default: false
      appgroup_editors:
        description: Include editor packages
        required: false
        type: boolean
        default: false
      appgroup_email:
        description: Include email packages
        required: false
        type: boolean
        default: false
      appgroup_internet:
        description: Include internet utility packages
        required: false
        type: boolean
        default: false
      appgroup_multimedia:
        description: Include multimedia packages
        required: false
        type: boolean
        default: false
      appgroup_office:
        description: Include office packages
        required: false
        type: boolean
        default: false
      appgroup_programming:
        description: Include programming packages
        required: false
        type: boolean
        default: false
      appgroup_remote_desktop:
        description: Include remote desktop packages
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-kernel-x86:
    name: Build kernel and Cix driver artifacts on x86
    runs-on: ${{ inputs.kernel_runner_system }}
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show disk usage before cleanup
        run: df -h

      - name: Free disk space on runner
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h

      - name: Install and enable qemu binfmt for arm64 chroot
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo modprobe binfmt_misc || true
          sudo mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          sudo update-binfmts --enable qemu-arm || true
          sudo update-binfmts --enable qemu-aarch64 || true
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          /usr/bin/qemu-aarch64-static --version

      - name: Ensure build script is executable
        run: chmod +x build.sh

      - name: Apply Android kernel support patch
        if: ${{ inputs.add_kernel_android_support }}
        run: |
          set -euxo pipefail
          git apply --check fork_patch/0001-cix-enable-kernel-android-support.patch
          git apply fork_patch/0001-cix-enable-kernel-android-support.patch

      - name: Apply USB device kernel support patch
        if: ${{ inputs.add_kernel_usb_device_support }}
        run: |
          set -euxo pipefail
          git apply --check fork_patch/0002-cix-enable-usb-device-gadget-support.patch
          git apply fork_patch/0002-cix-enable-usb-device-gadget-support.patch

      - name: Build kernel and Cix artifacts
        run: |
          set -euxo pipefail
          sudo --preserve-env=DEBIAN_FRONTEND ./build.sh \
            LIB_TAG="" \
            BOARD=orangepi6plus \
            BUILD_OPT=kernel \
            BRANCH=next \
            KERNEL_CONFIGURE=no \
            GITEE_SERVER=yes \
            DOWNLOAD_MIRROR=china

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi6plus-kernel-artifacts
          path: |
            output/debs
            output/cix
            output/debug
          if-no-files-found: error
          retention-days: 7

  build-image-arm64:
    name: Build Ubuntu image on ARM64
    needs: build-kernel-x86
    runs-on: ${{ inputs.image_runner_system }}
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show disk usage before cleanup
        run: df -h

      - name: Free disk space on runner
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h

      - name: Ensure build script is executable
        run: chmod +x build.sh

      - name: Install and enable qemu binfmt for x86 tools on ARM64
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo modprobe binfmt_misc || true
          sudo mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          sudo update-binfmts --enable qemu-i386 || true
          sudo update-binfmts --enable qemu-x86_64 || true
          test -e /proc/sys/fs/binfmt_misc/qemu-x86_64
          /usr/bin/qemu-x86_64-static --version
          /usr/bin/qemu-i386-static --version

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: orangepi6plus-kernel-artifacts
          path: kernel-artifacts

      - name: Restore kernel artifacts into workspace
        run: |
          set -euxo pipefail
          mkdir -p output

          if [ -d kernel-artifacts/output ]; then
            cp -a kernel-artifacts/output/. output/
          else
            [ -d kernel-artifacts/debs ] && cp -a kernel-artifacts/debs output/
            [ -d kernel-artifacts/cix ] && cp -a kernel-artifacts/cix output/
            [ -d kernel-artifacts/debug ] && cp -a kernel-artifacts/debug output/ || true
          fi

          test -d output/debs
          test -d output/cix
          find output -maxdepth 2 -type d | sort

      - name: Resolve selected desktop appgroups
        id: appgroups
        env:
          APPGROUP_3DSUPPORT: ${{ inputs.appgroup_3dsupport }}
          APPGROUP_BROWSERS: ${{ inputs.appgroup_browsers }}
          APPGROUP_CHAT: ${{ inputs.appgroup_chat }}
          APPGROUP_DESKTOP_TOOLS: ${{ inputs.appgroup_desktop_tools }}
          APPGROUP_EDITORS: ${{ inputs.appgroup_editors }}
          APPGROUP_EMAIL: ${{ inputs.appgroup_email }}
          APPGROUP_INTERNET: ${{ inputs.appgroup_internet }}
          APPGROUP_MULTIMEDIA: ${{ inputs.appgroup_multimedia }}
          APPGROUP_OFFICE: ${{ inputs.appgroup_office }}
          APPGROUP_PROGRAMMING: ${{ inputs.appgroup_programming }}
          APPGROUP_REMOTE_DESKTOP: ${{ inputs.appgroup_remote_desktop }}
        run: |
          set -euxo pipefail

          selected=()
          [ "${APPGROUP_3DSUPPORT}" = "true" ] && selected+=("3dsupport")
          [ "${APPGROUP_BROWSERS}" = "true" ] && selected+=("browsers")
          [ "${APPGROUP_CHAT}" = "true" ] && selected+=("chat")
          [ "${APPGROUP_DESKTOP_TOOLS}" = "true" ] && selected+=("desktop_tools")
          [ "${APPGROUP_EDITORS}" = "true" ] && selected+=("editors")
          [ "${APPGROUP_EMAIL}" = "true" ] && selected+=("email")
          [ "${APPGROUP_INTERNET}" = "true" ] && selected+=("internet")
          [ "${APPGROUP_MULTIMEDIA}" = "true" ] && selected+=("multimedia")
          [ "${APPGROUP_OFFICE}" = "true" ] && selected+=("office")
          [ "${APPGROUP_PROGRAMMING}" = "true" ] && selected+=("programming")
          [ "${APPGROUP_REMOTE_DESKTOP}" = "true" ] && selected+=("remote_desktop")

          echo "selected=${selected[*]}" >> "${GITHUB_OUTPUT}"

      - name: Build Ubuntu Noble GNOME image
        env:
          DESKTOP_APPGROUPS_SELECTED: ${{ steps.appgroups.outputs.selected }}
        run: |
          set -euxo pipefail
          sudo --preserve-env=DEBIAN_FRONTEND ./build.sh \
            LIB_TAG="" \
            BOARD=orangepi6plus \
            BUILD_OPT=image \
            BRANCH=next \
            RELEASE=noble \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_ENVIRONMENT=gnome \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            DESKTOP_APPGROUPS_SELECTED="${DESKTOP_APPGROUPS_SELECTED}" \
            DESKTOP_APT_FLAGS_SELECTED="" \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL=oldcache \
            GITEE_SERVER=yes \
            DOWNLOAD_MIRROR=china \
            COMPRESS_OUTPUTIMAGE=yes

      - name: Prepare split release assets
        id: collect
        run: |
          set -euxo pipefail
          latest_dir="$(find output/images -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
          if [ -z "${latest_dir}" ]; then
            echo "No image output directory found." >&2
            exit 1
          fi

          xz_file="$(find "${latest_dir}" -maxdepth 1 -type f -name '*.img.xz' | sort | head -n 1)"
          if [ -z "${xz_file}" ]; then
            echo "No compressed image (.img.xz) found in ${latest_dir}." >&2
            exit 1
          fi

          xz_name="$(basename "${xz_file}")"
          release_root="${GITHUB_WORKSPACE}/release-assets"
          release_dir="${release_root}/$(basename "${latest_dir}")"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"

          sha_file="${release_dir}/${xz_name}.sha256sum"
          hash_value="$(sha256sum -b "${xz_file}" | awk '{print $1}')"
          printf '%s *%s\n' "${hash_value}" "${xz_name}" > "${sha_file}"

          rm -f "${release_dir}/${xz_name}.part-"*
          split -b 500M -d -a 3 "${xz_file}" "${release_dir}/${xz_name}.part-"

          mapfile -t release_files < <(find "${release_dir}" -maxdepth 1 -type f \( -name "${xz_name}.part-*" -o -name "${xz_name}.sha256sum" \) | sort)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No split release files found in ${release_dir}." >&2
            exit 1
          fi

          {
            echo "latest_dir=${latest_dir}"
            echo "release_dir=${release_dir}"
            echo "image_name=${xz_name}"
            echo "release_files<<EOF"
            printf '%s\n' "${release_files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangepi6plus-split-image
          path: |
            ${{ steps.collect.outputs.release_dir }}
            output/debug
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release and upload image
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_FILES: ${{ steps.collect.outputs.release_files }}
          RELEASE_IMAGE_NAME: ${{ steps.collect.outputs.image_name }}
          DESKTOP_APPGROUPS_SELECTED: ${{ steps.appgroups.outputs.selected }}
          ADD_KERNEL_ANDROID_SUPPORT: ${{ inputs.add_kernel_android_support }}
          ADD_KERNEL_USB_DEVICE_SUPPORT: ${{ inputs.add_kernel_usb_device_support }}
          KERNEL_RUNNER_SYSTEM: ${{ inputs.kernel_runner_system }}
          IMAGE_RUNNER_SYSTEM: ${{ inputs.image_runner_system }}
        run: |
          set -euxo pipefail

          tag="${INPUT_RELEASE_TAG}"
          if [ -z "${tag}" ] || [ "${tag}" = "auto" ]; then
            tag="orangepi6plus-split-ubuntu-desktop-$(date -u +%Y%m%d-%H%M%S)-run${GITHUB_RUN_NUMBER}"
          fi

          title="Orange Pi 6 Plus Ubuntu Noble Desktop ${tag}"
          notes="$(cat <<EOF
          Automated split build for Orange Pi 6 Plus.

          Kernel build runner:
          ${KERNEL_RUNNER_SYSTEM}

          Image build runner:
          ${IMAGE_RUNNER_SYSTEM}

          Build command on ARM64 image job:
          sudo ./build.sh BOARD=orangepi6plus BUILD_OPT=image BRANCH=next RELEASE=noble BUILD_DESKTOP=yes BUILD_MINIMAL=no DESKTOP_ENVIRONMENT=gnome DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED=\"${DESKTOP_APPGROUPS_SELECTED}\" DESKTOP_APT_FLAGS_SELECTED=\"\" KERNEL_CONFIGURE=no CLEAN_LEVEL=oldcache GITEE_SERVER=yes DOWNLOAD_MIRROR=china COMPRESS_OUTPUTIMAGE=yes

          Android kernel support patch:
          ${ADD_KERNEL_ANDROID_SUPPORT}

          USB device kernel support patch:
          ${ADD_KERNEL_USB_DEVICE_SUPPORT}

          Release asset format:
          ${RELEASE_IMAGE_NAME}.part-000 ... ${RELEASE_IMAGE_NAME}.part-XXX
          ${RELEASE_IMAGE_NAME}.sha256sum

          Rebuild command:
          cat ${RELEASE_IMAGE_NAME}.part-* > ${RELEASE_IMAGE_NAME}
          sha256sum -c ${RELEASE_IMAGE_NAME}.sha256sum

          Commit:
          ${GITHUB_SHA}
          EOF
          )"

          mapfile -t files <<< "${RELEASE_FILES}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --title "${title}" \
              --notes "${notes}" \
              --target "${GITHUB_SHA}"
          fi
